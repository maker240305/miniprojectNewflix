<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영화 상세 - 넷플릭스</title>
    <link rel="stylesheet" href="movie.css" />
  </head>
  <body>
    <!-- 상단 네비게이션 (뒤로가기 또는 홈으로 이동) -->
    <header class="header">
      <a class="logo" href="../index/index.html">NETFLIX</a>
      <!-- a 태그에 history.back() 적용 -->
      <a href="#" onclick="history.back(); return false;" class="back-btn">돌아가기</a>
    </header>

    <!-- 영화 상세 콘텐츠 영역 -->
    <main class="movie-detail-container">
      <div class="movie-backdrop">
        <!-- 배경 이미지 영역 -->
        <div class="overlay"></div>
      </div>

      <div class="movie-info-content">
        <h1 id="movie-title">영화 제목 로딩 중...</h1>
        <div class="movie-meta">
          <span id="movie-year">2026</span>
          <span id="movie-rating" class="badge">15+</span>
          <span id="movie-duration">2시간 10분</span>
        </div>
        <p id="movie-description" class="movie-desc">
          영화 상세 소개 문구가 들어갈 영역입니다. 잠시만 기다려주세요.
        </p>
        <div class="movie-actions">
          <button type="button" class="play-btn">▶ 재생</button>
          <button type="button" class="add-list-btn">+ 내가 찜한 콘텐츠</button>
        </div>
      </div>
    </main>

    <script src="movie.js"></script>
  </body>
</html>
